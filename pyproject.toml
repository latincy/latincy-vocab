[project]
name = "latincy-vocab"
version = "0.1.0"
description = "Latin vocabulary list builder powered by LatinCy spaCy ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.7",
    "latincy-preprocess",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocabbuilder"]
